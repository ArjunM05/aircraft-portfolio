<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" sizes="any" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0a2848" />
		<meta
			name="description"
			content="Arjun M, Full Stack Software Developer. An interactive Airbus A350 blueprint portfolio."
		/>
		<meta property="og:title" content="Arjun M | Full Stack Software Developer" />
		<meta
			property="og:description"
			content="Frontend, backend and AI/ML work, drawn as an aircraft blueprint."
		/>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;600&family=IBM+Plex+Mono:wght@400&display=swap"
			rel="stylesheet"
		/>
		<script>
			// Has the pre-flight intro already played in this tab? Decided before the first paint.
			// The key must match PREFLIGHT_SEEN_STORAGE_KEY in src/lib/data/preflight-checklist.ts.
			try {
				if (sessionStorage.getItem('portfolio-preflight-seen')) {
					document.documentElement.dataset.introSeen = 'true';
				}
			} catch {
				/* storage blocked: the intro simply plays */
			}
		</script>
		<noscript
			><style>
				.preflight {
					display: none !important;
				}
			</style></noscript
		>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
